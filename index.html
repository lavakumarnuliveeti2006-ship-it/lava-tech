<!DOCTYPE html>
<html>
<head>
  <title>CodeLearn Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>CodeLearn Practice</h1>
  <p>Learn coding languages from lessons to practical execution</p>
</header>

<section class="languages">
  <h2>Choose a Language</h2>

  <div class="cards">
    <button onclick="selectLanguage('C')">C</button>
    <button onclick="selectLanguage('C++')">C++</button>
    <button onclick="selectLanguage('Java')">Java</button>
    <button onclick="selectLanguage('Python')">Python</button>
  </div>
</section>

<section class="lesson">
  <h2 id="languageTitle">Select a language</h2>
  <p id="lessonText">Your lesson will appear here.</p>
</section>

<section class="practice">
  <h2>Practice Code</h2>

  <textarea id="codeBox" placeholder="Write your code here..."></textarea>

  <button class="runBtn" onclick="runCode()">Run Code</button>

  <h3>Output:</h3>
  <div id="outputBox">Output will appear here...</div>
</section>

<script src="script.js"></script>
</body>
</html>
